name: Build

on:
  push:
    branches: [main, develop]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: NickelHome
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pgaskin/nickeltc:1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Build
        run: make clean all strip koboroot

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: NickelHome
          path: |
            KoboRoot.tgz
            src/libnickelhome.so

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: NickelHome

      - name: Extract release notes from CHANGELOG.md
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$GITHUB_REF_NAME" '
              $0 == "## " tag { found = 1; next }
              found && /^## /  { exit }
              found            { print }
            ' CHANGELOG.md > release-notes.md
          else
            : > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: NickelHome ${{ github.ref_name }}
          body_path: release-notes.md
          files: KoboRoot.tgz
